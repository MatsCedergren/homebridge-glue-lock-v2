name: Publish to npm

# Runs when a GitHub release is published. npm trusted publishing (OIDC) is used: no npm token is stored.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Check that the release tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version $VERSION."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint, type-check, build and test
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm test

      - name: Publish
        run: npm publish
